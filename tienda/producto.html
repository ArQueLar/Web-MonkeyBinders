<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto | Monkey Binders</title>
    <link rel="icon" href="../assets/Cosas Web/Logo/Monkey.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/styles.css">
    <style>
        .product-detail-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .product-gallery {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
        }
        .product-main-img {
            max-height: 400px;
            margin: 0 auto;
            object-fit: contain;
            width: 100%;
        }
        .gallery-thumbs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .thumb-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            padding: 4px;
            background: var(--bg-card-img);
        }
        .thumb-img.active {
            border-color: var(--accent-jungle);
        }
        .selector-group {
            margin: 20px 0;
        }
        .size-options {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .size-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .size-btn.active {
            border-color: var(--accent-jungle);
            background: var(--bg-surface);
            color: var(--accent-jungle);
        }
        .qty-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .qty-btn {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0;
            line-height: 1;
        }
        .qty-btn:hover {
            background: var(--bg-surface);
            border-color: var(--accent-jungle);
            color: var(--accent-jungle);
        }
        .qty-picker input {
            width: 60px;
            height: 40px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            outline: none;
            line-height: 40px;
            margin: 0;
            padding: 0;
            -moz-appearance: textfield;
        }
        .qty-picker input::-webkit-outer-spin-button,
        .qty-picker input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Adaptación Responsive para Móviles */
        @media (max-width: 992px) {
            .product-detail-container {
                grid-template-columns: 1fr !important;
                gap: 24px;
                margin: 20px auto;
                padding: 0 16px;
            }
            .product-main-img {
                max-height: 320px;
            }
        }

        @media (max-width: 576px) {
            .product-detail-container {
                gap: 20px;
                margin: 16px auto;
                padding: 0 12px;
            }
            .product-main-img {
                max-height: 250px;
            }
            .product-info-panel h1 {
                font-size: 24px !important;
            }
            .size-options {
                flex-direction: column;
                gap: 8px;
            }
            .size-btn {
                padding: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="announcement-bar">
        <div class="announcement-content">
            <div class="announcement-item"><span>⚡</span><span>Binders Exclusivos con <span class="highlight">Grabado Láser de Precisión</span></span></div>
        </div>
    </div>

    <header class="main-header" id="main-header">
        <div class="header-container">
            <a href="../index.html" class="brand-logo" id="logo-link">
                <img src="../assets/Cosas Web/Logo/Logo.png" alt="Monkey Binders Logo" id="header-logo-img">
            </a>

            <nav class="nav-container">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="../index.html" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="tienda.html" class="nav-link active">Tienda</a></li>
                    <li class="nav-item"><a href="../index.html#about" class="nav-link">Sobre Nosotros</a></li>
                    <li class="nav-item"><a href="../index.html#reviews" class="nav-link">Comunidad</a></li>
                    <li class="nav-item"><a href="../index.html#contact" class="nav-link">Contacto</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" id="theme-toggle-btn" title="Alternar Tema">
                    <img src="../assets/Cosas Web/svg/luna.svg" alt="Tema" class="header-icon-svg" id="theme-icon">
                </button>
                <button class="icon-btn" id="search-toggle-btn" title="Buscar Productos">
                    <img src="../assets/Cosas Web/svg/lupa.svg" alt="Buscar" class="header-icon-svg">
                </button>
                <button class="icon-btn" id="account-toggle-btn" title="Cuenta de Usuario">
                    <img src="../assets/Cosas Web/svg/perfil.svg" alt="Perfil" class="header-icon-svg">
                </button>
                <button class="icon-btn" id="cart-toggle-btn" title="Carrito de Compras">
                    <img src="../assets/Cosas Web/svg/carrito.svg" alt="Carrito" class="header-icon-svg">
                    <span class="badge-count" id="cart-count-badge">0</span>
                </button>
                <button class="icon-btn mobile-only-btn" id="mobile-menu-toggle-btn" title="Menú Móvil">
                    ☰
                </button>
            </div>
        </div>
    </header>

    <main class="product-detail-container" id="product-detail-view">
        <!-- Contenido generado dinámicamente desde app.js -->
    </main>

    <footer class="main-footer">
        <div class="footer-bottom">
            <div>© 2026 Monkey Binders. Todos los derechos reservados.</div>
        </div>
    </footer>

    <div class="cart-drawer-overlay" id="cart-drawer-overlay">
        <div class="cart-drawer">
            <div class="cart-header">
                <div class="cart-title"><span>TU CARRITO</span></div>
                <button class="close-drawer-btn" id="close-cart-btn">✕</button>
            </div>
            <div class="cart-items-list" id="cart-items-list"></div>
            <div class="cart-footer">
                <div class="cart-subtotal"><span>SUBTOTAL:</span><span id="cart-subtotal">0.00 €</span></div>
                <button class="checkout-btn" onclick="alert(' Redirigiendo al checkout seguro!')">FINALIZAR COMPRA</button>
            </div>
        </div>
    </div>

    <!-- MOBILE NAV DRAWER OVERLAY -->
    <div class="mobile-nav-overlay" id="mobile-nav-overlay">
        <div class="mobile-nav-drawer">
            <div class="mobile-nav-header">
                <span style="font-weight:800; color:var(--accent-jungle);">MONKEY BINDERS</span>
                <button class="close-drawer-btn" id="close-mobile-nav-btn">✕</button>
            </div>
            <ul class="mobile-nav-list">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="tienda.html#customizer">Personalizar</a></li>
                <li><a href="../index.html#about">Sobre Nosotros</a></li>
                <li><a href="../index.html#reviews">Comunidad</a></li>
                <li><a href="../index.html#contact">Contacto</a></li>
            </ul>
        </div>
    </div>

    <!-- MODAL VISTA RÁPIDA / CUENTA / BUSCADOR -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button style="position:absolute; top:15px; right:15px; font-size:20px; color:var(--text-primary);" id="close-modal-btn">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <script src="../backend/app.js"></script>
</body>
</html>
